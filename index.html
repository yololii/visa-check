<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070B12">
<title>澳洲签证通过率测试</title>
<style>
:root{
  --ink:#070B12;
  --line:rgba(255,255,255,.09);
  --text:#F3F6FA;
  --muted:#8D99AB;
  --gold:#FFC65C;
  --green:#35D399;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.app{max-width:480px;margin:0 auto;min-height:100svh;position:relative;padding:0 22px;overflow:hidden}
.app::before{content:"";position:fixed;inset:0;max-width:480px;margin:0 auto;pointer-events:none;
  background:
    radial-gradient(120% 55% at 50% -10%, rgba(255,198,92,.20), transparent 62%),
    radial-gradient(90% 45% at 105% 22%, rgba(53,211,153,.13), transparent 60%),
    linear-gradient(180deg,#0B1119 0%, #070B12 48%, #05080D 100%);
  z-index:-1}
.scale{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hidden{display:none!important}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 0}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:.5px}
.mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;font-weight:900;font-family:inherit;
  background:linear-gradient(135deg,#FFD27A,#F5A524);color:#2A1B00;box-shadow:0 6px 18px rgba(245,165,36,.32)}
.pill{font-size:11px;font-weight:700;color:#FFD79B;border:1px solid rgba(255,198,92,.32);
  background:rgba(255,198,92,.09);padding:6px 11px;border-radius:99px;letter-spacing:.4px}

/* hero */
.home{min-height:calc(100svh - 62px);display:flex;flex-direction:column;justify-content:flex-start;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 0 4px}
.kicker{font-size:10.5px;letter-spacing:.22em;font-weight:800;color:var(--gold);text-transform:uppercase}
h1{margin:16px 0 0;font-size:clamp(39px,11.6vw,54px);line-height:1.12;font-weight:900;letter-spacing:-1.6px}
h1 .hi{position:relative;display:inline-block;color:var(--gold);white-space:nowrap}
h1 .hi::after{content:"";position:absolute;left:-4%;right:-4%;bottom:.06em;height:.30em;border-radius:4px;
  background:linear-gradient(90deg,rgba(255,198,92,.32),rgba(245,165,36,.10));z-index:-1}
.sub{margin:14px 0 0;font-size:13.5px;line-height:1.8;color:#B9C4D4;letter-spacing:.2px;max-width:330px}
.art{position:relative;width:100%;max-width:288px;margin:52px auto 0;padding-bottom:30px}
.flag{position:relative;width:100%;aspect-ratio:2/1;border-radius:13px;overflow:hidden;
  transform:rotate(-5deg);border:2px solid #FFE7AE;
  box-shadow:0 24px 52px rgba(0,0,0,.65),0 0 0 2px rgba(255,231,174,.16),0 0 22px rgba(255,214,130,.18)}
.flag img{display:block;width:100%;height:100%;object-fit:contain;background:#00247D}
.seal{position:absolute;right:-8px;bottom:2px;width:116px;height:116px;border-radius:50%;
  background:linear-gradient(165deg,rgba(16,13,20,.86),rgba(16,13,20,.66));
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  border:2.5px solid rgba(240,96,88,.95);transform:rotate(-13deg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  color:#FF9C93;box-shadow:0 16px 34px rgba(0,0,0,.62)}
.seal::before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px dashed rgba(255,123,114,.7)}
.seal .q{font-size:74px;font-weight:900;line-height:1;position:relative;color:#FF8A7D;
  text-shadow:0 0 22px rgba(240,96,88,.55),0 3px 16px rgba(0,0,0,.45)}
.meta{margin:16px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.14em;font-weight:700}
.meta em{font-style:normal;color:#DCE4EF;font-weight:800}
.dims{margin:30px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;column-gap:14px;row-gap:11px;width:100%;max-width:344px;text-align:left}
.dims li{display:flex;align-items:center;gap:7px;font-size:11px;color:#A7B3C4;line-height:1.5;white-space:nowrap}
.dims i{font-style:normal;color:var(--green);font-weight:900;flex:none}

/* CTA */
.cta-wrap{text-align:center;padding-top:48px}
.hook{font-size:12px;color:#9FAAB9;margin:0 0 12px;line-height:1.7}
.hook b{color:var(--gold);font-weight:800}
.btn{
  width:100%;border:0;border-radius:18px;height:66px;font-size:18px;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(135deg,#FFD27A 0%,#FFC65C 42%,#F59E19 100%);
  color:#231500;cursor:pointer;box-shadow:0 16px 38px rgba(245,158,25,.36),0 2px 0 rgba(255,255,255,.45) inset;
  display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;
  transition:transform .12s ease, box-shadow .2s ease;
}
.btn:active{transform:scale(.985);box-shadow:0 8px 20px rgba(245,158,25,.3)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  animation:sheen 3.4s ease-in-out infinite}
@keyframes sheen{0%{left:-60%}55%{left:130%}100%{left:130%}}
.ghost{width:100%;height:54px;margin-top:10px;border-radius:15px;background:transparent;color:#C8D2DF;
  border:1px solid var(--line);font-size:14px;font-weight:700;cursor:pointer}
.fine{font-size:10.5px;color:#75808F;line-height:1.75;margin:13px 6px 0}

/* quiz */
#quiz{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.qbar{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);letter-spacing:.12em;font-weight:800;padding-top:18px}
.prog{height:4px;border-radius:99px;background:rgba(255,255,255,.10);margin:11px 0 30px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#35D399,#FFC65C);transition:width .35s cubic-bezier(.3,.9,.2,1)}
.qidx{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.14em}
.qt{font-size:26px;line-height:1.36;font-weight:900;letter-spacing:-.8px;margin:12px 0 10px}
.qh{font-size:12.5px;color:var(--muted);line-height:1.85;margin:0 0 22px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.045);
  border-radius:15px;padding:14px 15px;display:flex;align-items:center;gap:12px;color:var(--text);
  font-size:14px;font-weight:700;cursor:pointer;transition:border-color .18s,background .18s,transform .1s}
.opt:active{transform:scale(.99)}
.opt .e{width:38px;height:38px;flex:none;border-radius:11px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:18px}
.opt .tx{flex:1;min-width:0}
.opt small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:4px;line-height:1.55}
.opt.sel{border-color:rgba(255,198,92,.85);background:rgba(255,198,92,.13);box-shadow:0 0 0 1px rgba(255,198,92,.5),0 8px 22px rgba(0,0,0,.3)}
.opt.sel .e{background:rgba(255,198,92,.22)}
.qnav{display:flex;gap:10px;margin-top:24px}
.back{width:60px;flex:none;height:60px;border-radius:15px;background:transparent;border:1px solid var(--line);
  color:#CBD5E1;font-size:18px;cursor:pointer}
.qnav .btn{height:60px;font-size:15.5px}
.btn-hero{height:82px;font-size:30px;font-weight:900;letter-spacing:6px;border-radius:22px}
.btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none}
.btn[disabled]::after{display:none}

/* result */
#report{padding-bottom:calc(26px + env(safe-area-inset-bottom))}
.rhead{text-align:center;padding-top:24px}
.rhead .kicker{color:var(--green)}
.ring{width:210px;height:210px;margin:22px auto 0;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(from -90deg, var(--gold) 0deg, var(--gold) 0deg, rgba(255,255,255,.07) 0deg);
  box-shadow:0 0 60px rgba(255,198,92,.22)}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#0A0F17}
.ring .in{position:relative;text-align:center}
.ring .num{font-size:56px;font-weight:900;letter-spacing:-2px;line-height:1}
.ring .num span{font-size:19px;font-weight:800;color:var(--muted)}
.ring .lbl{font-size:11px;letter-spacing:.2em;color:var(--muted);margin-top:8px;font-weight:800}
.verdict{font-size:20px;font-weight:900;margin:22px 0 0;letter-spacing:-.4px;text-align:center;line-height:1.5}
.vsub{font-size:13px;color:#A8B4C4;line-height:1.85;margin:10px auto 0;max-width:330px;text-align:center}
.card{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:16px;padding:17px;margin-top:16px}
.card h3{margin:0 0 14px;font-size:13px;letter-spacing:.06em;font-weight:800;display:flex;align-items:center;gap:7px}
.bars{display:grid;gap:13px}
.brow{display:grid;grid-template-columns:88px 1fr 34px;align-items:center;gap:10px;font-size:11.5px;color:#B9C4D4}
.track{height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#35D399,#8CE0B9);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.brow strong{text-align:right;font-size:12px;color:#E8EEF6}
.advs{display:grid;gap:13px}
.adv{display:flex;gap:11px}
.adv em{flex:none;width:26px;height:26px;border-radius:9px;background:rgba(255,198,92,.16);display:grid;place-items:center;font-style:normal;font-size:13px}
.adv b{display:block;font-size:12.5px;margin-bottom:4px}
.adv p{margin:0;font-size:11.5px;line-height:1.75;color:var(--muted)}
.warn{border-color:rgba(255,107,107,.30);background:rgba(255,107,107,.08)}
.warn h3{color:#FF9A9A}
.share{display:flex;gap:10px;margin-top:18px}
.share .btn{height:58px;font-size:15.5px}
.share .ghost{margin:0;width:auto;flex:none;padding:0 18px;height:58px}

/* 好评返现横幅 */
.cbbar{margin-top:16px;padding:11px 12px;border-radius:12px;text-align:center;
  border:1px solid rgba(255,198,92,.30);
  background:linear-gradient(150deg,rgba(255,198,92,.15),rgba(255,198,92,.05));
  font-size:13px;font-weight:800;color:#FFD79B;letter-spacing:.4px;line-height:1.55}
.dsm{text-align:center;font-size:10.5px;line-height:1.7;color:#66717F;margin-top:9px;letter-spacing:.2px}
.disclaim{background:rgba(255,198,92,.07);border:1px solid rgba(255,198,92,.22);border-radius:14px;padding:13px 14px;
  font-size:10.5px;line-height:1.8;color:#CBB98F;margin-top:16px}
.foot{text-align:center;font-size:10px;color:#5F6B7C;margin-top:22px;letter-spacing:.08em}

/* result v2 */
.rtitle{padding-top:20px;text-align:center}
.rtitle-label{font-size:18px;font-weight:800;color:#C6D2E1;letter-spacing:.6px;
  display:flex;align-items:center;justify-content:center;gap:7px}
.rtitle-label img{width:30px;height:15px;border-radius:3px;display:block;
  box-shadow:0 2px 9px rgba(0,0,0,.55);outline:2px solid #FFE7AE}
.rtitle-num{margin-top:8px;font-size:clamp(62px,18vw,84px);line-height:.96;font-weight:900;letter-spacing:-3px}
.rtitle-num span{font-size:.40em;font-weight:800;margin-left:1px;letter-spacing:0}
.peerbox{margin-top:18px;text-align:center}
.peerline{font-size:13px;color:#AEB9C9;line-height:1.7}
.peerline b{color:var(--gold);font-size:21px;font-weight:900;margin:0 2px}
.peerbar{position:relative;height:9px;border-radius:99px;background:rgba(255,255,255,.09);margin:13px 0 0;overflow:hidden}
.peerbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFD27A,#F59E19);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.peermark{position:absolute;top:-3px;width:3px;height:15px;border-radius:2px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.7);transition:left 1s cubic-bezier(.2,.8,.2,1)}
.radar{width:100%;display:block;margin:2px 0 -6px}

/* gauge + risk */
.gauge{position:relative;width:244px;height:244px;margin:26px auto 0}
.gauge .ring{position:absolute;inset:30px;width:auto;height:auto;margin:0}
.gauge .ring::before{inset:8px}
.gauge .num{font-size:62px;letter-spacing:-2px}
.gauge .num span{font-size:20px}
.gauge .lbl{font-size:10px;letter-spacing:.18em}
.zlab{position:absolute;transform:translate(-50%,-50%);font-size:9.5px;font-weight:800;
  letter-spacing:.04em;white-space:nowrap;opacity:.30}
.zlab.on{opacity:1;font-size:19px;font-weight:900;letter-spacing:0;text-shadow:0 0 18px currentColor,0 2px 10px rgba(0,0,0,.6)}
.lv{font-style:normal;font-size:9.5px;font-weight:900;padding:2px 6px;border-radius:6px;
  border:1px solid currentColor;margin-left:7px;vertical-align:1px;letter-spacing:.02em}

/* result v3 */
.rtitle-k{font-size:12px;letter-spacing:.22em;font-weight:800;color:var(--muted)}
.rtitle-label{font-size:clamp(33px,10.6vw,48px);font-weight:900;letter-spacing:-1px;color:#EAEFF7;gap:9px}
.rtitle-label img{width:42px;height:21px;border-radius:4px}
.radar{max-width:300px;margin:10px auto 0;display:block}
.rlegend{display:flex;justify-content:center;gap:16px;margin:8px 0 2px;font-size:10.5px;color:#8FA0B6}
.rlegend span{display:flex;align-items:center}
.rlegend i{display:inline-block;width:16px;margin-right:5px}
.lsolid{border-top:2px solid #FFC65C}
.ldash{border-top:1.5px dashed rgba(160,176,198,.9)}
/* 优势项 */
.procard{border:1px solid rgba(53,211,153,.26);background:rgba(53,211,153,.055);border-radius:16px;padding:16px 16px 14px;margin-top:16px}
.prohead{display:flex;align-items:center;gap:11px}
.proico{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:900;
  color:#08301F;background:linear-gradient(140deg,#7BE8B6,#2EC98C);box-shadow:0 8px 22px rgba(53,211,153,.30)}
.prohead h3{margin:0;font-size:16px;font-weight:900;letter-spacing:-.2px;color:#E6F7EE}
.prohead h3 b{color:#35D399;font-size:20px;margin:0 3px}
.prohead p{margin:5px 0 0;font-size:11px;color:var(--muted);line-height:1.6}
.probox{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.pch{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#CFEBDD;
  border:1px solid rgba(53,211,153,.25);background:rgba(53,211,153,.10);padding:7px 10px;border-radius:99px}
.pch i{font-style:normal;color:#35D399;font-weight:900;font-size:11px}
.acc-rowhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 2px}
.acc-body{display:none}
.acc.open .acc-body{display:block}
.acc-head,.acc-rowhead{cursor:pointer;user-select:none}
.acc .card h3, .acc-rowhead h3{margin:0}
.chev{flex:none;margin-left:8px;font-size:11px;font-weight:900;color:#8FA0B6;transition:transform .22s;line-height:1}
.acc.open .chev{transform:rotate(180deg)}
.lettercard{border:1px solid rgba(255,198,92,.24);background:rgba(255,198,92,.05);border-radius:16px;padding:16px;margin-top:16px}
.lettercard.ok{border-color:rgba(53,211,153,.24);background:rgba(53,211,153,.05)}
.lhead{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.lhead h3{font-size:14px;font-weight:900;color:#F4E3C6;margin:0;flex:1;letter-spacing:.02em}
.len{flex:none;font-size:9.5px;font-weight:800;letter-spacing:.09em;color:#8FA0B6;text-transform:lowercase}
.lchip{flex:none;font-size:10.5px;font-weight:900;padding:4px 9px;border-radius:8px}
.lchip.need{color:#FFC65C;background:rgba(255,198,92,.16)}
.lchip.no{color:#7FE3B9;background:rgba(53,211,153,.13)}
.lsub{font-size:11.5px;color:#A7B3C4;line-height:1.75;margin:0 0 10px}
.llist{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.llist li{background:rgba(255,255,255,.045);border-radius:11px;padding:10px 12px}
.llist b{display:block;font-size:12.5px;color:#F5EDE0;font-weight:900;margin-bottom:4px}
.llist span{font-size:11px;color:#A7B3C4;line-height:1.7}
.lmore{font-size:10.5px;color:#8FA0B6;margin:9px 0 0}
.riskcard{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:16px;padding:18px 16px 8px;margin-top:16px}
.riskhead{display:flex;align-items:center;gap:12px;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,.07)}
.riskicon{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff;
  background:linear-gradient(140deg,#FF7A7A,#D93B3B);box-shadow:0 8px 22px rgba(217,59,59,.42)}
.riskhead h3{margin:0;font-size:16.5px;font-weight:900;letter-spacing:-.2px}
.riskhead h3 b{color:#FF6B6B;font-size:21px;margin:0 3px}
.riskhead p{margin:5px 0 0;font-size:11px;color:var(--muted);line-height:1.6}
.riskcta{margin-left:auto;flex:none;font-size:10.5px;font-weight:900;color:#FF9A9A;
  background:rgba(255,107,107,.13);border:1px solid rgba(255,107,107,.32);padding:7px 11px;border-radius:99px}
.risksec{font-size:12.5px;font-weight:900;color:#D8E2EF;margin:16px 0 2px}
.rk{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.rk:last-child{border-bottom:0;padding-bottom:8px}
.rkico{width:42px;height:42px;flex:none;border-radius:12px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:18px}
.rkbody{flex:1;min-width:0}
.rkrow{display:flex;align-items:center;gap:8px}
.rkrow b{flex:1;font-size:13px;font-weight:800;line-height:1.45}
.rkact{flex:none;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:8px;
  color:#FF9A9A;background:rgba(255,107,107,.12)}
.rkact.ok{color:#7FE3B9;background:rgba(53,211,153,.13)}
.rkact.t{color:#8FD3FF;background:rgba(143,211,255,.14)}
.rkact.g{color:#FFC65C;background:rgba(255,198,92,.14)}
.rktag{display:inline-block;margin-top:7px;font-size:9.5px;font-weight:900;padding:2px 8px;border-radius:6px;letter-spacing:.03em}
.rktag.h{color:#FF7A7A;background:rgba(255,107,107,.16)}
.rktag.m{color:#FFC65C;background:rgba(255,198,92,.15)}
.rktag.l{color:#4FE0AC;background:rgba(53,211,153,.15)}
.rkbody p{margin:8px 0 0;font-size:11.5px;line-height:1.85;color:var(--muted)}





/* 结果页四模块：共用同一个头部组件，图标/标题/箭头位置结构上一致 */
.acc{padding:0 !important}
.acc > .acc-body{padding:0 16px 16px}
.acc .acch{min-height:66px;padding:0 16px;display:flex;align-items:center;gap:12px;box-sizing:border-box;
  cursor:pointer;user-select:none}
.acc .acico{width:36px;height:36px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:900;line-height:1;letter-spacing:0}
.acc .acico.ok{color:#08301F;background:linear-gradient(140deg,#7BE8B6,#2EC98C);box-shadow:0 8px 22px rgba(53,211,153,.28)}
.acc .acico.rk{color:#fff;background:linear-gradient(140deg,#FF7A7A,#D93B3B);box-shadow:0 8px 22px rgba(217,59,59,.36)}
.acc .acico.lc{color:#3B2A08;background:linear-gradient(140deg,#FFDF9E,#F0B94B);box-shadow:0 8px 22px rgba(240,185,75,.26)}
.acc .acico.rd{color:#0B2340;background:linear-gradient(140deg,#AECBFF,#5B8DEF);box-shadow:0 8px 22px rgba(91,141,239,.26)}
.acc .acch h3{flex:1;min-width:0;margin:0;font-size:16px;font-weight:900;letter-spacing:-.2px;line-height:1.35;color:#E9F2FA}

const MAX = QUESTIONS.reduce((a,q)=>a+q.w,0);
let answers = new Array(QUESTIONS.length).fill(null);
let idx = 0;
const $ = id => document.getElementById(id);

function begin(){
  $("home").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  idx = 0;

  render();
  window.scrollTo({top:0});
}

/* 按身份跳过不适用的题：退休 / 在读学生 / 全职家庭没有工资与在职关系 */
function skipQ(i){
  const who = answers[4];
  const noJob = (who===2 || who===4 || who===5);
  if(i===6 && noJob) return true;   /* 工资发放 */
  if(i===7 && noJob) return true;   /* 在职真实性 */
  return false;
}
function visList(){ return QUESTIONS.map((q,i)=>i).filter(i=>!skipQ(i)); }

function render(){
  const q = QUESTIONS[idx];
  const vis = visList();
  const pos = vis.indexOf(idx);
  $("qidx").textContent = "Q" + (pos+1) + " / " + vis.length;
  $("qcat").textContent = q.cat;
  $("prog").style.width = ((pos+1)/vis.length*100).toFixed(1)+"%";
  $("qt").textContent = q.t;

  const box = $("opts");
  box.innerHTML = "";
  q.o.forEach((o,i)=>{
    const b = document.createElement("button");
    b.className = "opt" + (answers[idx]===i ? " sel" : "");
    b.innerHTML = '<span class="e">'+o.e+'</span><span class="tx">'+o.l+'</span>';
    b.onclick = ()=>{
      answers[idx] = i;
      Array.prototype.forEach.call(box.children, c=>c.classList.remove("sel"));
      b.classList.add("sel");
      $("nextBtn").disabled = false;
      setTimeout(()=>{ if(answers[idx]===i) next(); }, 260);
    };
    box.appendChild(b);
  });
  $("nextBtn").disabled = answers[idx]===null;
  $("nextBtn").textContent = pos===vis.length-1 ? "看结果　→" : "下一题　→";
  $("quiz").classList.remove("scale");
  void $("quiz").offsetWidth;
  $("quiz").classList.add("scale");
}

function next(){
  if(answers[idx]===null) return;
  const vis = visList();
  const pos = vis.indexOf(idx);
  if(pos >= 0 && pos < vis.length-1){ idx = vis[pos+1]; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else report();
}
function prev(){
  const vis = visList();
  const pos = vis.indexOf(idx);
  if(pos > 0){ idx = vis[pos-1]; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else { $("quiz").classList.add("hidden"); $("home").classList.remove("hidden"); }
}

function score(){
  let got = 0, den = 0;
  QUESTIONS.forEach((q,i)=>{
    const a = answers[i]; if(a===null) return;
    const s = q.o[a].s; if(s===null) return;
    den += q.w; got += q.w * s;
  });
  const raw = den ? got / den : 0;
  const pct = Math.round(24 + raw*73);
  /* 男性校准 +2（按产品要求设定，非官方口径） */
  const pctAdj = (answers[0] === 0) ? Math.min(95, pct + 2) : pct;
  const dims = { "回国约束力":{got:0,max:0}, "资金与收入":{got:0,max:0}, "记录与诚信":{got:0,max:0} };
  const map = { "回国约束":"回国约束力", "回国动机":"回国约束力", "年龄":"回国约束力", "婚姻":"回国约束力", "子女":"回国约束力", "资产":"回国约束力",
                "月收入":"资金与收入", "资金能力":"资金与收入", "工资发放":"资金与收入", "身份":"资金与收入",
                "出入境记录":"记录与诚信", "澳签历史":"记录与诚信", "敏感旅行":"记录与诚信", "拒签史":"记录与诚信", "逾期遣返":"记录与诚信", "材料一致性":"记录与诚信", "在职真实性":"记录与诚信", "移民倾向":"记录与诚信" };
  QUESTIONS.forEach((q,i)=>{
    const key = map[q.cat]; if(!key) return;
    const a = answers[i]; if(a===null) return;
    const s = q.o[a].s; if(s===null) return;
    dims[key].got += q.w * s;
    dims[key].max += q.w;
  });
  return {pct: pctAdj, raw, dims};
}

function radarAxes(){

    {k:"目的与行程", cats:["出行目的","行程计划","接待方","同行人"]},
    {k:"资金收入",   cats:["资金能力","月收入","工资发放","身份"]},
    {k:"回国约束",   cats:["回国约束","回国动机","年龄","婚姻","子女","资产"]},
    {k:"出入境记录", cats:["出入境记录","澳签历史","敏感旅行"]},
    {k:"材料可信度",   cats:["材料一致性","在职真实性"]},
    {k:"身份合规性",   cats:["拒签史","逾期遣返","健康状况","犯罪记录","移民倾向"]}
  ];
  return groups.map(g=>{
    let got=0,max=0;
    QUESTIONS.forEach((q,i)=>{
      if(g.cats.indexOf(q.cat)<0) return;
      const a=answers[i];
      if(a!==null && q.o[a].s!==null){ max+=q.w; got+=q.w*q.o[a].s; }
      else if(a===null){ max+=q.w; }
    });
    return {k:g.k, v: max?Math.round(got/max*100):0};
  });
}
/* 平均申请人基准：按各维度分别取值，不是一条 60 分的同心圈 */
const AVG_AXES = { "目的与行程":80, "资金收入":72, "回国约束":78, "出入境记录":55, "材料可信度":82, "身份合规性":95 };

function radarSVG(data, base){
  const N=data.length, cx=186, cy=150, R=90;
  let s='';
  for(let g=1;g<=4;g++){
    const r=R*g/4, pts=[];
    for(let i=0;i<N;i++){ const a=-Math.PI/2+i*2*Math.PI/N;
      pts.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1)); }
    s+='<polygon points="'+pts.join(' ')+'" fill="'+(g===1?'rgba(255,198,92,.055)':'none')+
       '" stroke="rgba(255,255,255,'+(g===4?.20:.075)+')"/>';
  }
  for(let i=0;i<N;i++){ const a=-Math.PI/2+i*2*Math.PI/N;
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(a)).toFixed(1)+'" y2="'+(cy+R*Math.sin(a)).toFixed(1)+
       '" stroke="rgba(255,255,255,.09)"/>';
  }
  /* 平均申请人基准线：每个维度各一个值 */
  if(base){
    const avgPts=[];
    for(let i=0;i<N;i++){ const a=-Math.PI/2+i*2*Math.PI/N, r=R*Math.max(base[i].v,4)/100;
      avgPts.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1)); }
    s+='<polygon points="'+avgPts.join(' ')+'" fill="none" stroke="rgba(160,176,198,.9)" stroke-width="1.3" stroke-dasharray="5 4"/>';
  }
  const pts=data.map((d,i)=>{ const a=-Math.PI/2+i*2*Math.PI/N, r=R*Math.max(d.v,4)/100;
    return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; });
  s+='<polygon points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+
     '" fill="url(#radarFill)" stroke="#FFC65C" stroke-width="1.7" stroke-linejoin="round"/>';
  data.forEach((d,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/N;
    s+='<circle cx="'+pts[i][0].toFixed(1)+'" cy="'+pts[i][1].toFixed(1)+'" r="3.2" fill="#FFD27A"/>';
    const lr=R+19, lx=cx+lr*Math.cos(a), ly=cy+lr*Math.sin(a);
    const cs=Math.cos(a), anchor=Math.abs(cs)<.25?'middle':(cs>0?'start':'end');
    s+='<text x="'+lx.toFixed(1)+'" y="'+(ly+1).toFixed(1)+'" text-anchor="'+anchor+
       '" font-size="14.5" font-weight="800" fill="#A9B8CC">'+d.k+'</text>';
    s+='<text x="'+lx.toFixed(1)+'" y="'+(ly+18).toFixed(1)+'" text-anchor="'+anchor+
       '" font-size="13" font-weight="900" fill="#FFC65C">'+d.v+'</text>';
  });
  return '<svg class="radar" viewBox="0 0 372 306" preserveAspectRatio="xMidYMid meet">'+
    '<defs><linearGradient id="radarFill" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="rgba(255,198,92,.34)"/>'+
      '<stop offset="100%" stop-color="rgba(53,211,153,.24)"/></linearGradient></defs>'+s+'</svg>';
}

/* ---- 同龄人分位 ---- */
function peerPct(pct){
  const p = 100/(1+Math.exp(-(pct-58)/14));
  return Math.max(3, Math.min(97, Math.round(p)));
}

const ZONES=[
  {t:"极高",c:"#35D399",p:93},
  {t:"较高",c:"#8FD373",p:77},
  {t:"一般",c:"#FFC65C",p:63},
  {t:"较低",c:"#FF9C57",p:47},
  {t:"非常低",c:"#FF6B6B",p:20}
];
function tierIdx(pct){ return pct>=85?0:pct>=70?1:pct>=55?2:pct>=40?3:4; }

function zoneLabels(pct){
  const k=tierIdx(pct);
  return ZONES.map((z,i)=>{
    const a=(-90+z.p*3.6)*Math.PI/180, R=(i===k)?112:104;
    const x=122+R*Math.cos(a), y=122+R*Math.sin(a);
    return '<span class="zlab'+(i===k?' on':'')+'" style="left:'+x.toFixed(0)+'px;top:'+y.toFixed(0)+'px;color:'+z.c+'">'+z.t+'</span>';
  }).join("");
}

    else if(tone.t==="非常低") tone.s += "主要问题「"+tops[0]+"」，建议先处理再递交。";
  }
  const good = buildStrengths();
  const peer = peerPct(pct);
  const flag = document.querySelector('#home .flag img').getAttribute('src');
  const tagCls = t => t==="高风险"?"h":t==="中风险"?"m":"l";
  const allAdv = buildAdvice(pct, 99).filter(a=>a.lv.t!=="小提示");
  const letters = buildLetter(allAdv);

function buildLetter(adv){
  const seen = {}, out = [];
  adv.forEach(a=>{
    const m = LETTER_MAP[a.q+"-"+a.o];
    if(!m) return;
    if(seen[m[0]]) return;
    seen[m[0]] = 1;
    out.push({q:a.q, t:m[0], h:m[1]});
  });
  out.sort((x,y)=>x.q-y.q);
  return out;
}

function buildAdvice(pct, cap){
  cap = cap || 3;
  const list = [];
  RISK_RULES.forEach(it=>{
    if(answers[it.q] !== it.o || answers[it.q] === null) return;
    const s = QUESTIONS[it.q].o[it.o].s;
    const lv = s < .36 ? {t:"高风险", c:"#FF6B6B"}
             : s < .72 ? {t:"中风险", c:"#FFC65C"}
             : {t:"低风险", c:"#35D399"};
    list.push({e:it.e, b:it.b, p:it.p, lv:lv, s:s, w:QUESTIONS[it.q].w, q:it.q, o:it.o});
  });

  const rank = {"高风险":0, "中风险":1, "低风险":2};
  list.sort((a,b)=> rank[a.lv.t]-rank[b.lv.t] || b.w-a.w);

  if(pct>=85)
    list.push({e:"✅", lv:{t:"小提示", c:"#35D399"}, s:1, w:0,
      b:"材料按顺序整理成一份", p:"首页放目录、按类别编号。材料齐全但翻找困难，核对时一样会扣印象。"});

  return list.slice(0,cap);
}

function animateGauge(pct, color){
  const ring=$("ring"), num=$("num");
  const dur=1100, st=performance.now();
  (function tick(now){
    const p=Math.min(1,(now-st)/dur), e=1-Math.pow(1-p,3), v=Math.round(pct*e);
    const deg=(v*3.6).toFixed(1);
    if(ring) ring.style.background="conic-gradient(from -90deg,"+color+" 0deg,"+color+" "+deg+"deg,rgba(255,255,255,.07) "+deg+"deg)";
    num.innerHTML=v+"<span>%</span>"; num.style.color=color;
    if(p<1) requestAnimationFrame(tick);
  })(st);
}

function restart(){
  $("report").classList.add("hidden");
  $("home").classList.remove("hidden");
  answers = new Array(QUESTIONS.length).fill(null);

function copyResult(pct, btn){
  const text = "我在「过签率」测了澳洲签证：" + pct + "%，档位「" + ["极高","较高","一般","较低","非常低"][tierIdx(pct)] + "」。";
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      const old = btn.textContent; btn.textContent = "已复制 ✓";
      setTimeout(()=>btn.textContent = old, 1600);
    }, ()=>alert(text));
  } else { alert(text); }
}

<script>
/* 入口订单号校验（纯前端，不联网） */
(function(){
  var KEY = "vc_gate_ok_v1";
  var gate  = document.getElementById("gate");
  var card  = document.getElementById("gcard");
  var input = document.getElementById("ginput");
  var err   = document.getElementById("gerr");
  var btn   = document.getElementById("gbtn");
  if(!gate) return;
  var granted = false;
  try { granted = localStorage.getItem(KEY) === "1"; } catch(e){}
  if(granted){ gate.remove(); return; }
  document.body.classList.add("gated");

  function norm(v){
    return (v || "").replace(/[\s\u200b-\u200d\ufeff]/g, "").toUpperCase();
  }
  function fail(msg){
    err.textContent = msg;
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
    input.focus();
  }
  function pass(no){
    try {
      localStorage.setItem(KEY, "1");
      if(no) localStorage.setItem("vc_order_no", no);
    } catch(e){}
    gate.classList.add("off");
    document.body.classList.remove("gated");
    setTimeout(function(){ if(gate.parentNode) gate.remove(); }, 280);
  }
  function check(){
    var v = norm(input.value);
    var hit = v.match(/P\d{18}/);
    if(!hit) return fail("订单号不存在");
    pass(hit[0]);
  }
  btn.addEventListener("click", check);
  input.addEventListener("keydown", function(e){ if(e.key === "Enter") check(); });
  input.addEventListener("input", function(){ err.textContent = ""; });
  setTimeout(function(){ input.focus(); }, 300);
})();
</script>
